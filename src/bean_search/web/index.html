<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bean Search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 34'%3E%3Crect x='2' y='4' width='24' height='27' rx='4' fill='%23e4572e' stroke='%232a1a0f' stroke-width='2.5'/%3E%3Crect x='2' y='12' width='24' height='11' fill='%23ffd23f'/%3E%3Cellipse cx='14' cy='4.5' rx='12' ry='3' fill='%23ddd' stroke='%232a1a0f' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="map" aria-label="Map of bean locations"></div>

  <header class="panel logo">
    <span class="logo-can" aria-hidden="true"></span>
    <h1>Bean&nbsp;Search</h1>
  </header>

  <section class="panel hud" aria-live="polite">
    <div class="stat">
      <span class="stat-label">Beans</span>
      <span class="stat-value" id="beans">0</span>
      <span class="stat-sub">of <span id="total-beans">–</span></span>
    </div>
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moves">0</span>
      <span class="stat-sub">/ <span id="budget-echo">150</span></span>
      <div class="meter"><div class="meter-fill" id="moves-fill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-label">Km</span>
      <span class="stat-value" id="km">0.0</span>
    </div>
  </section>

  <section class="panel controls">
    <p class="hint" id="hint">Click the map to drop your bean buddy!</p>
    <label class="slider-row" for="budget">
      <span>Moves</span>
      <input type="range" id="budget" min="10" max="600" step="10" value="150">
      <output id="budget-out" for="budget">150</output>
    </label>
    <div class="buttons">
      <button id="go" class="btn btn-go" disabled>GO!</button>
      <button id="reset" class="btn btn-reset">Reset</button>
    </div>
    <div class="far" id="far" hidden>
      <span class="far-title">Far-away beans</span>
      <ul id="far-list"></ul>
    </div>
  </section>

  <div class="banner" id="banner" hidden>
    <div class="panel banner-card">
      <h2 id="banner-title">Level complete!</h2>
      <p id="banner-text"></p>
      <ol id="banner-list"></ol>
      <button id="again" class="btn btn-go">Play again</button>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
