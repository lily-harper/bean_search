[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bean_search"
version = "0.1.0"
description = "Road-network search for the nearest beans (canned, sculpture, or city)."
authors = [{ name = "Lily Holmes" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.2",
    "requests>=2.31",
    "shapely>=2.0",
    "scikit-learn>=1.3",  # osmnx nearest_nodes on unprojected graphs uses BallTree
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bean-search = "bean_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bean_search = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
